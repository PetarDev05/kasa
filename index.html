<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kasa za vezbanje</title>
  </head>
  <body>
    <div id="header">
      <p>KOMITENT</p>
      <p>DOKUMENT</p>
    </div>
    <div id="screen"></div>
    <div id="separator">X</div>
    <div id="buttons-container">
      <div id="numeric-buttons">
        <button class="num-btn">7</button>
        <button class="num-btn">8</button>
        <button class="num-btn">9</button>
        <button class="num-btn">4</button>
        <button class="num-btn">5</button>
        <button class="num-btn">6</button>
        <button class="num-btn">1</button>
        <button class="num-btn">2</button>
        <button class="num-btn">3</button>
        <button class="num-btn-c">C</button>
        <button class="num-btn">0</button>
        <button class="num-btn">.</button>
      </div>
      <div id="operation-buttons">
        <button id="x" class="op-btn">X</button>
        <button id="plu" class="op-btn">PLU</button>
      </div>
    </div>
    <script src="./scripts/main.js" type="module"></script>
  </body>
</html>
